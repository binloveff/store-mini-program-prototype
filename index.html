<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="theme-color" content="#f7f6f2"><title>尊美生活 · 门店小程序原型</title>
<style>
:root{--ink:#202923;--muted:#7c857e;--green:#355c49;--pale:#eaf0e9;--cream:#f7f6f2;--line:#e9e8e1;--orange:#c9794f}*{box-sizing:border-box}body{margin:0;background:#e8e9e4;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.phone{width:min(100%,430px);min-height:100vh;margin:auto;background:var(--cream);position:relative;padding-bottom:84px;overflow:hidden;box-shadow:0 0 40px #25342b17}.top{padding:19px 22px 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-family:Georgia,serif;font-size:21px;letter-spacing:1px;color:var(--green)}.brand small{display:block;font:10px sans-serif;color:var(--muted);letter-spacing:2px;margin-top:3px}.avatar{border:0;background:#e7e9e2;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}.hero{margin:4px 16px 13px;height:194px;border-radius:21px;position:relative;overflow:hidden;color:white;background:linear-gradient(108deg,#284536,#69806a 55%,#b5a387);transition:background .3s}.hero:before{content:"";position:absolute;width:240px;height:240px;border:1px solid #ffffff38;border-radius:50%;right:-40px;top:15px;box-shadow:0 0 0 23px #ffffff0c,0 0 0 48px #ffffff0a}.hero:after{content:"";position:absolute;width:90px;height:170px;right:59px;bottom:-36px;background:#d6bb93;border-radius:50% 50% 20% 20%;transform:rotate(-28deg);opacity:.62}.herotext{position:absolute;z-index:1;left:22px;top:25px}.eyebrow{font-size:10px;letter-spacing:2px;opacity:.8}.hero h1{font-family:Georgia,serif;font-weight:400;font-size:31px;line-height:1.14;margin:12px 0 8px}.hero p{font-size:12px;opacity:.85;margin:0}.pill{position:absolute;bottom:17px;left:22px;background:#ffffff24;border:1px solid #ffffff52;border-radius:20px;padding:7px 12px;font-size:11px;color:white;z-index:1;cursor:pointer}.dots{position:absolute;right:18px;bottom:22px;z-index:2;display:flex;gap:6px}.dots button{width:6px;height:6px;border:0;border-radius:10px;background:#ffffff7d;padding:0;cursor:pointer}.dots button.on{width:19px;background:white}.section{padding:11px 19px 4px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}.sectionhead h2{font-size:18px;margin:0;font-weight:650}.sectionhead span{font-size:11px;color:var(--muted)}.storecard{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #efeee9;border-radius:15px;padding:14px 14px;margin:0 0 12px}.pin{width:37px;height:37px;display:grid;place-items:center;border-radius:12px;background:var(--pale);font-size:18px;flex:none}.storeinfo{min-width:0;flex:1}.storeinfo strong{font-size:13px}.storeinfo div{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{border:0;background:none;color:var(--green);font-size:12px;cursor:pointer;padding:8px 1px}.search{height:45px;border:1px solid var(--line);background:white;border-radius:13px;display:flex;align-items:center;padding:0 13px;gap:9px;margin:0 0 14px}.search input{border:0;outline:0;flex:1;font-size:13px;background:transparent;min-width:0}.search button{border:0;background:var(--green);color:white;border-radius:9px;padding:7px 12px;cursor:pointer}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:7px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{border:1px solid #e6e5de;background:transparent;border-radius:18px;padding:7px 13px;font-size:11px;color:#68736b;white-space:nowrap;cursor:pointer}.filter.active{background:var(--green);color:white;border-color:var(--green)}.tools{display:flex;align-items:center;justify-content:space-between;padding:7px 1px 10px;font-size:11px;color:var(--muted)}.tools select{border:0;background:transparent;color:var(--green);font-size:11px;outline:0}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid #eeede7;border-radius:15px;padding:13px;display:grid;grid-template-columns:68px 1fr auto;gap:12px;align-items:center}.thumb{height:68px;border-radius:12px;display:grid;place-items:center;font-size:25px;background:linear-gradient(140deg,#e5e8db,#c9d2bf)}.item:nth-child(2n) .thumb{background:linear-gradient(140deg,#eee0d2,#dbb99e)}.item:nth-child(3n) .thumb{background:linear-gradient(140deg,#dce6e3,#a7bfba)}.item h3{font-size:13px;margin:0 0 5px}.item p{font-size:10px;color:var(--muted);margin:0 0 8px}.price{font-size:14px;color:var(--orange);font-weight:650;white-space:nowrap}.price small{font-size:10px;font-weight:400}.item button{grid-column:3;grid-row:1/3;border:1px solid #d8e1d8;border-radius:18px;background:#f4f7f3;color:var(--green);font-size:11px;padding:7px 11px;cursor:pointer;align-self:end}.empty{background:white;border-radius:14px;text-align:center;color:var(--muted);padding:30px 10px;font-size:13px}.footerline{text-align:center;color:#a4aaa3;font-size:10px;margin:23px 0 3px}.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);height:70px;padding:9px 33px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-between;z-index:5}.tab{border:0;background:none;color:#929b93;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;cursor:pointer}.tab i{font-style:normal;font-size:19px}.tab.active{color:var(--green)}.overlay{position:fixed;inset:0;background:#1c2a2180;z-index:10;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{width:min(100%,430px);background:var(--cream);border-radius:22px 22px 0 0;padding:24px 22px 30px;animation:up .2s ease}.@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}.sheettop{display:flex;justify-content:space-between;align-items:center}.sheet h2{font-size:20px;margin:5px 0}.close{border:0;background:#e9eae4;border-radius:50%;width:30px;height:30px;cursor:pointer}.sheet p{font-size:12px;color:var(--muted);line-height:1.7}.privacy{background:#fff;padding:12px;border-radius:12px;font-size:11px;line-height:1.7;color:#566159;margin:15px 0;display:flex;gap:8px}.privacy input{accent-color:var(--green);margin:2px 0;flex:none}.loginbtn{width:100%;border:0;background:var(--green);color:white;border-radius:12px;padding:14px;font-size:14px;cursor:pointer}.loginbtn:disabled{opacity:.4;cursor:not-allowed}.secondary{width:100%;border:0;background:transparent;color:var(--muted);padding:13px;cursor:pointer}.toast{position:fixed;z-index:20;bottom:88px;left:50%;transform:translateX(-50%);background:#202923e8;color:white;padding:10px 15px;border-radius:24px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}.toast.show{opacity:1}.detail{position:fixed;inset:0;background:var(--cream);z-index:8;display:none;overflow:auto;padding:20px 20px 35px}.detail.show{display:block}.detail .back{border:0;background:white;border-radius:10px;padding:8px 12px;color:var(--green);cursor:pointer}.detailHero{height:185px;border-radius:18px;background:linear-gradient(135deg,#dce6db,#a6b8a5);display:grid;place-items:center;font-size:62px;margin:17px 0}.detail h1{font-size:23px}.detail p{color:var(--muted);font-size:13px;line-height:1.8}.detail .book{position:sticky;bottom:12px;width:100%;border:0;border-radius:13px;background:var(--green);color:white;padding:14px;font-size:14px;margin-top:25px;cursor:pointer}
</style></head>
<body><main class="phone"><header class="top"><div class="brand">尊美生活<small>ZUNMEI · BEAUTY & WELLNESS</small></div><button class="avatar" aria-label="登录" onclick="openLogin()">◉</button></header>
<section class="hero" id="hero"><div class="herotext"><div class="eyebrow" id="eyebrow">SLOW DOWN, FEEL BETTER</div><h1 id="heroTitle">把时间留给<br>更好的自己</h1><p id="heroSub">一处安静的日常疗愈空间</p></div><button class="pill" onclick="jumpProjects()">探索本店项目　↗</button><div class="dots"><button class="on" aria-label="第1张" onclick="slide(0)"></button><button aria-label="第2张" onclick="slide(1)"></button><button aria-label="第3张" onclick="slide(2)"></button></div></section>
<section class="section"><div class="sectionhead"><h2>找到我们</h2><span>欢迎到店体验</span></div><div class="storecard"><div class="pin">⌖</div><div class="storeinfo"><strong>尊美雅荟青春魔法箱 · 金水万达店</strong><div>科源路与科新路交叉口万达公馆北门向西50米路南（农业银行附近） · 0371-58566699</div></div><button class="arrow" onclick="navigateStore()">导航　›</button></div></section>
<section class="section" id="projects"><div class="sectionhead"><h2>精选项目</h2><span id="resultCount">6 项服务</span></div><div class="search"><span>⌕</span><input id="searchInput" placeholder="搜索项目名称或功效" oninput="render()"><button onclick="render()">搜索</button></div><div class="filters" id="filters"></div><div class="tools"><span id="filterSummary">为你找到合适的放松方式</span><label>排序 <select id="sortSelect" onchange="render()"><option value="default">推荐</option><option value="priceUp">价格从低到高</option><option value="priceDown">价格从高到低</option><option value="time">时长从短到长</option></select></label></div><div class="list" id="list"></div><div class="footerline">每一份松弛，都从照顾自己开始</div></section>
<nav class="tabbar"><button class="tab active" onclick="goTab('home',this)"><i>⌂</i>首页</button><button class="tab" onclick="goTab('projects',this)"><i>▦</i>项目</button><button class="tab" onclick="goTab('store',this)"><i>⌖</i>门店</button><button class="tab" onclick="openLogin()"><i>◉</i>我的</button></nav>
<section class="overlay" id="loginOverlay" onclick="if(event.target===this)closeLogin()"><div class="sheet"><div class="sheettop"><h2>欢迎来到尊美生活</h2><button class="close" onclick="closeLogin()">×</button></div><p>登录后可查看预约记录与专属服务。浏览门店和项目无需登录。</p><label class="privacy"><input id="consent" type="checkbox" onchange="toggleLogin()"><span>我已阅读并同意<a href="#" onclick="openPolicy(event)">《个人信息保护指引》</a>。我们仅在提供预约服务时使用必要信息，手机号将由你主动授权后获取。</span></label><button class="loginbtn" id="loginBtn" disabled onclick="doLogin()">同意并微信快捷登录</button><button class="secondary" onclick="closeLogin()">暂不登录</button></div></section>
<section class="detail" id="detail"><button class="back" onclick="closeDetail()">← 返回项目</button><div class="detailHero" id="detailIcon">🌿</div><div id="detailBody"></div><button class="book" onclick="bookNow()">预约体验</button></section><div class="toast" id="toast"></div></main>
<script>
const data=[{name:'舒缓肩颈护理',cat:'身体护理',price:198,time:45,icon:'🌿',desc:'温和舒展肩颈肌群，缓解久坐带来的紧绷感。由专业护理师根据你的状态调整力度。'},{name:'草本热石舒压',cat:'身体护理',price:328,time:75,icon:'🪨',desc:'以温润热石配合舒缓手法，让身体慢慢放松下来。适合想要完整休息一场的你。'},{name:'深层清洁护理',cat:'面部护理',price:268,time:60,icon:'🫧',desc:'温和清洁与补水护理，帮助肌肤恢复清爽舒适。具体步骤将按肤质沟通确认。'},{name:'芳香头部放松',cat:'头疗放松',price:168,time:40,icon:'🌼',desc:'结合轻柔头部按摩与植物香气，给忙碌思绪一个暂停的机会。'},{name:'定制面部护理',cat:'面部护理',price:398,time:90,icon:'✨',desc:'到店沟通肌肤需求后，为你搭配适合的护理流程。服务前会再次确认内容与价格。'},{name:'足部舒缓护理',cat:'身体护理',price:158,time:35,icon:'🪷',desc:'从足部开始放松，温热护理搭配舒缓按摩，适合短暂休息与日常养护。'}];const cats=['全部','身体护理','面部护理','头疗放松'];let activeCat='全部',slideIndex=0;const slides=[['BEAUTY BEGINS WITH CARE','把时间留给<br>更好的自己','尊美生活，守护你的美丽时刻'],['A LITTLE CARE, EVERY DAY','今天也要<br>好好照顾自己','从一次轻松的护理开始'],['YOUR MOMENT OF CALM','在城市一隅<br>找到片刻松弛','尊美雅荟青春魔法箱 · 金水万达店']];
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}function renderFilters(){document.getElementById('filters').innerHTML=cats.map(c=>`<button class="filter ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}function setCat(c){activeCat=c;render()}function render(){renderFilters();let q=document.getElementById('searchInput').value.trim().toLowerCase();let arr=data.filter(x=>(activeCat==='全部'||x.cat===activeCat)&&(!q||x.name.toLowerCase().includes(q)||x.cat.toLowerCase().includes(q)||x.desc.toLowerCase().includes(q)));let sort=document.getElementById('sortSelect').value;if(sort==='priceUp')arr.sort((a,b)=>a.price-b.price);if(sort==='priceDown')arr.sort((a,b)=>b.price-a.price);if(sort==='time')arr.sort((a,b)=>a.time-b.time);document.getElementById('resultCount').textContent=`${arr.length} 项服务`;document.getElementById('filterSummary').textContent=q?`“${q}”的搜索结果`:activeCat==='全部'?'为你找到合适的放松方式':`正在浏览：${activeCat}`;document.getElementById('list').innerHTML=arr.length?arr.map(x=>`<article class="item"><div class="thumb">${x.icon}</div><div><h3>${x.name}</h3><p>${x.cat} · ${x.time} 分钟</p><div class="price">¥${x.price}<small> / 次</small></div></div><button onclick="showDetail('${x.name}')">查看详情</button></article>`).join(''):'<div class="empty">没有找到匹配的项目<br><span style="font-size:11px">试试其他关键词或分类</span></div>'}function slide(i){slideIndex=i;document.querySelectorAll('.dots button').forEach((b,j)=>b.classList.toggle('on',j===i));let x=slides[i];document.getElementById('eyebrow').textContent=x[0];document.getElementById('heroTitle').innerHTML=x[1];document.getElementById('heroSub').textContent=x[2];document.getElementById('hero').style.background=['linear-gradient(108deg,#284536,#69806a 55%,#b5a387)','linear-gradient(108deg,#584735,#aa815d 55%,#d6b799)','linear-gradient(108deg,#304944,#6c9990 55%,#bdc9b5)'][i]}setInterval(()=>slide((slideIndex+1)%3),5000);function jumpProjects(){document.getElementById('projects').scrollIntoView({behavior:'smooth'})}function goTab(t,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(t==='home')window.scrollTo({top:0,behavior:'smooth'});else if(t==='projects')jumpProjects();else{document.querySelector('.storecard').scrollIntoView({behavior:'smooth',block:'center'});toast('已定位到门店信息')}}function navigateStore(){toast('将打开地图导航（接入微信后调用 wx.openLocation）')}function openLogin(){document.getElementById('loginOverlay').classList.add('show')}function closeLogin(){document.getElementById('loginOverlay').classList.remove('show')}function toggleLogin(){document.getElementById('loginBtn').disabled=!document.getElementById('consent').checked}function doLogin(){if(!document.getElementById('consent').checked)return;closeLogin();toast('原型演示：接入后由微信完成登录与手机号授权')}function openPolicy(e){e.preventDefault();toast('个人信息保护指引：用于预约履约、订单通知与账号安全；可在“我的”申请查询或删除')}function showDetail(name){let x=data.find(y=>y.name===name);document.getElementById('detailIcon').textContent=x.icon;document.getElementById('detailBody').innerHTML=`<div style="color:var(--muted);font-size:11px">${x.cat}　·　${x.time} 分钟</div><h1>${x.name}</h1><div class="price">¥${x.price}<small> / 次</small></div><p>${x.desc}</p><div style="background:white;padding:15px;border-radius:13px;margin-top:20px;font-size:12px;line-height:1.9"><strong>服务说明</strong><br>预约前可先与门店沟通；到店后确认服务内容、时长与价格再开始。若有特殊身体状况，请提前告知护理师。</div>`;document.getElementById('detail').classList.add('show')}function closeDetail(){document.getElementById('detail').classList.remove('show')}function bookNow(){closeDetail();openLogin();toast('预约前需要登录以便管理预约记录')}render();
</script></body></html>
